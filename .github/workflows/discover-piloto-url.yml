name: Discover piloto URL
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Probe host (no secrets in output)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "HOSTNAME=$(hostname -f 2>/dev/null || hostname)"
            echo "IPV4=$(curl -4 -sS --max-time 5 ifconfig.me || true)"
            echo "PORT_3322=$(ss -tlnp | grep -E ':3322|:8080|:4200|:80 ' || true)"
            echo "PM2=$(pm2 jlist 2>/dev/null | head -c 2000 || true)"
            if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              cd "${{ secrets.DEPLOY_PATH }}"
              echo "DEPLOY_EXISTS=yes"
              # Print only FRONTEND_URL / APP-ish keys, never secrets
              for f in .env backend/.env; do
                if [ -f "$f" ]; then
                  echo "ENV_FILE=$f"
                  grep -E '^(FRONTEND_URL|APP_URL|PUBLIC_APP_URL|CORS_ORIGIN|HOST|PORT)=' "$f" || true
                fi
              done
              ls frontend/dist/frontend/browser 2>/dev/null | head -5 || ls frontend/dist 2>/dev/null | head -5 || true
            fi
            # nginx vhosts without IPs/keys
            ls /etc/nginx/sites-enabled 2>/dev/null || true
            grep -h 'server_name\|listen\|root\|proxy_pass' /etc/nginx/sites-enabled/* 2>/dev/null | head -40 || true

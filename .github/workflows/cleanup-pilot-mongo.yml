name: Cleanup pilot Mongo smoke

# Ops: dry-run (default) ou delete dos tenants smoke/e2e no Mongo piloto.
# Secrets: environment Prod. Execute exige confirm=DELETE_SMOKE_E2E.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry_run (default) ou execute
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - execute
      confirm:
        description: Obrigatório em execute — DELETE_SMOKE_E2E
        required: false
        default: ''
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard execute confirmation
        if: ${{ inputs.mode == 'execute' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DELETE_SMOKE_E2E" ]; then
            echo "Execute bloqueado: confirme com DELETE_SMOKE_E2E"
            exit 1
          fi

      - name: Copy cleanup script to pilot
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: scripts/cleanup-pilot-mongo-smoke.mjs
          target: ${{ secrets.DEPLOY_PATH }}/scripts/
          strip_components: 1

      - name: Copy matcher lib to pilot
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: scripts/lib/pilotSmokeTenantMatch.mjs
          target: ${{ secrets.DEPLOY_PATH }}/scripts/lib/
          strip_components: 2

      - name: Run pilot Mongo smoke cleanup
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MODE: ${{ inputs.mode }}
          CONFIRM_DELETE: ${{ inputs.confirm }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,MODE,CONFIRM_DELETE
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "$DEPLOY_PATH"
            test -f scripts/cleanup-pilot-mongo-smoke.mjs
            test -f scripts/lib/pilotSmokeTenantMatch.mjs
            export NODE_PATH="$DEPLOY_PATH/node_modules:$DEPLOY_PATH/backend/node_modules${NODE_PATH:+:$NODE_PATH}"
            export MODE
            export CONFIRM_DELETE
            echo "=== cleanup-pilot-mongo-smoke MODE=${MODE} ==="
            node scripts/cleanup-pilot-mongo-smoke.mjs

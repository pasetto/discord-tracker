name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build --workspace=backend
            npm run build --workspace=frontend
            # Landing marketing (site/) — CTA aponta para FRONTEND_URL do host quando disponível
            APP_URL="$(grep -E '^FRONTEND_URL=' .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
            if [ -z "$APP_URL" ] && [ -f backend/.env ]; then
              APP_URL="$(grep -E '^FRONTEND_URL=' backend/.env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
            fi
            export PUBLIC_APP_URL="${APP_URL:-http://127.0.0.1:8080}"
            export PUBLIC_SITE_URL="http://127.0.0.1:4321"
            export PUBLIC_BASE_PATH="/"
            echo "Building site/ with PUBLIC_APP_URL=${PUBLIC_APP_URL}"
            npm run build --workspace=site
            # Reinjeta SMTP/VAPID no .env do host (secrets GH → dotenv; não loga valores)
            if [ -n "${SMTP_HOST:-}" ] && [ -n "${VAPID_PUBLIC_KEY:-}" ]; then
              node scripts/upsert-alerts-env.mjs .env backend/.env
            else
              echo "AVISO: secrets SMTP/VAPID ausentes no environment Prod — alertas podem ficar off"
            fi
            # restart limpo: delete + start garante workers homogêneos (sem pkill global)
            pm2 delete syntra 2>/dev/null || true
            pm2 start backend/ecosystem.config.js --update-env
            # Soft-launch: serve estático da landing na porta 4321
            pm2 delete syntra-site 2>/dev/null || true
            # Sem --spa <bool>: pm2 interpreta o valor como path/porta e quebra o bind
            pm2 serve ./site/dist 4321 --name syntra-site
            pm2 save
            sleep 8
            curl -sf --retry 5 --retry-delay 3 http://localhost:3322/api/v1/health
            if curl -sf --retry 3 --retry-delay 2 -o /dev/null http://127.0.0.1:4321/; then
              echo "PILOTO_SITE_LOCAL=http://127.0.0.1:4321 OK"
            else
              echo "AVISO: syntra-site :4321 não respondeu (landing pública = GitHub Pages)"
            fi
            echo "PILOTO_FRONTEND_URL=${PUBLIC_APP_URL}"

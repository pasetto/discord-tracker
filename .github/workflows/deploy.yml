name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build --workspace=backend
            npm run build --workspace=frontend
            # restart limpo: delete + start garante workers homogêneos (sem pkill global)
            pm2 delete syntra 2>/dev/null || true
            pm2 start backend/ecosystem.config.js --update-env
            pm2 save
            sleep 8
            curl -sf --retry 5 --retry-delay 3 http://localhost:3322/api/v1/health

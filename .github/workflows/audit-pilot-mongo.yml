name: Audit pilot Mongo smoke

# Ops read-only: lista orgs/users smoke, e2e@syntra.test e bootstrap@syntra.local
# no Mongo do host piloto. Secrets: environment Prod. Sem delete.

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy audit script to pilot
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: scripts/audit-pilot-mongo-smoke.mjs
          target: ${{ secrets.DEPLOY_PATH }}/scripts/
          strip_components: 1

      - name: Run read-only Mongo audit
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "$DEPLOY_PATH"
            test -f scripts/audit-pilot-mongo-smoke.mjs
            echo "=== audit-pilot-mongo-smoke (READ ONLY) ==="
            node scripts/audit-pilot-mongo-smoke.mjs

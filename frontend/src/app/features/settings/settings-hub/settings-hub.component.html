<section class="space-y-6">
  <header class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">Configurações</h2>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
      Ajuste colaboração, canais, calendário e alertas de inatividade do time.
    </p>
  </header>

  <nav class="grid gap-3 sm:grid-cols-2" aria-label="Hub de configurações">
    @for (item of items; track item.path) {
      <a
        [routerLink]="item.path"
        class="flex min-h-11 flex-col justify-center rounded-xl border border-gray-200 bg-white px-4 py-3 transition hover:border-brand-300 hover:bg-brand-50/40 dark:border-gray-800 dark:bg-white/[0.03] dark:hover:border-brand-500/40 dark:hover:bg-brand-500/5"
      >
        <span class="text-sm font-semibold text-gray-800 dark:text-white/90">{{ item.label }}</span>
        <span class="mt-1 text-xs leading-snug text-gray-500 dark:text-gray-400">{{ item.description }}</span>
      </a>
    }
  </nav>
</section>

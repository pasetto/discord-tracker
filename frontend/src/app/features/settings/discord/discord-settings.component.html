<section class="space-y-6">
  <header class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">Conexão Discord</h2>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
      Escolha o servidor monitorado. O bot deve estar cadastrado em <code>/admin/discord</code> antes.
    </p>
  </header>

  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
    <p class="text-sm text-gray-600 dark:text-gray-300">
      Bot conectado:
      <strong [class.text-success-600]="botConnected" [class.text-error-500]="!botConnected">
        {{ botConnected ? 'Sim' : 'Não' }}
      </strong>
    </p>
    <p *ngIf="activeConnection" class="mt-2 text-sm text-gray-600 dark:text-gray-300">
      Servidor ativo: <strong>{{ activeConnection.guildName }}</strong> ({{ activeConnection.guildId }})
    </p>
    <button type="button" class="mt-4 min-h-11 rounded-lg border px-4 py-2 text-sm" (click)="refresh()" [disabled]="loading">
      Atualizar lista
    </button>
  </div>

  <div class="grid gap-3 md:grid-cols-2">
    <button
      type="button"
      *ngFor="let guild of guilds"
      class="rounded-2xl border border-gray-200 p-4 text-left transition hover:border-brand-500 dark:border-gray-700"
      (click)="selectGuild(guild.guildId)"
    >
      <p class="font-medium text-gray-800 dark:text-white/90">{{ guild.guildName }}</p>
      <p class="text-xs text-gray-500">{{ guild.memberCount }} membros · {{ guild.guildId }}</p>
    </button>
  </div>

  <p *ngIf="errorMessage" class="rounded-lg border border-error-300 bg-error-50 px-3 py-2 text-sm text-error-600">{{ errorMessage }}</p>
  <p *ngIf="successMessage" class="rounded-lg border border-success-300 bg-success-50 px-3 py-2 text-sm text-success-700">{{ successMessage }}</p>
</section>

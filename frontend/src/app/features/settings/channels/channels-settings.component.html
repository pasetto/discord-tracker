<section class="space-y-6">
  <header class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">Canais colaborativos</h2>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
      Defina canais de voz e texto que contam para colaboração, além de AFK, almoço e ignorados.
    </p>
  </header>

  <div class="grid gap-4 rounded-2xl border border-gray-200 bg-white p-5 md:grid-cols-2 dark:border-gray-800 dark:bg-white/[0.03]">
    <label class="flex flex-col gap-1 text-sm text-gray-700 dark:text-gray-200">
      organizationId
      <input class="min-h-11 rounded-lg border border-gray-300 px-3 py-2 dark:border-gray-700 dark:bg-gray-900" [(ngModel)]="orgId" />
    </label>
    <label class="flex flex-col gap-1 text-sm text-gray-700 dark:text-gray-200">
      guildId
      <input class="min-h-11 rounded-lg border border-gray-300 px-3 py-2 dark:border-gray-700 dark:bg-gray-900" [(ngModel)]="guildId" />
    </label>
    <div class="flex flex-col gap-2 sm:flex-row md:col-span-2">
      <button type="button" class="min-h-11 rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white" (click)="refreshRules()" [disabled]="loading">
        Carregar regras
      </button>
      <button type="button" class="min-h-11 rounded-lg bg-success-500 px-4 py-2 text-sm font-medium text-white" (click)="saveRules()" [disabled]="loading">
        Salvar regras
      </button>
    </div>
  </div>

  <label class="block text-sm text-gray-700 dark:text-gray-200">
    Regras (JSON)
    <textarea
      class="mt-2 min-h-48 w-full rounded-lg border border-gray-300 p-3 font-mono text-xs dark:border-gray-700 dark:bg-gray-900"
      [(ngModel)]="rulesJson"
    ></textarea>
  </label>

  <p *ngIf="errorMessage" class="rounded-lg border border-error-300 bg-error-50 px-3 py-2 text-sm text-error-600">{{ errorMessage }}</p>
</section>

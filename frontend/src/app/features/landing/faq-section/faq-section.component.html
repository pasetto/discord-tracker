<section
  data-testid="landing-faq"
  class="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16"
>
  <h2
    class="text-2xl font-semibold text-gray-900 sm:text-3xl dark:text-white"
    data-motion="reveal-heading"
  >
    Perguntas frequentes
  </h2>
  <p
    class="mt-3 max-w-2xl text-sm text-gray-600 dark:text-gray-300"
    data-motion="reveal-lead"
  >
    Respostas diretas sobre metadados, vigilância, timesheet e teste sem cartão.
  </p>

  <div class="mt-8 divide-y divide-gray-200 border-y border-gray-200 dark:divide-gray-700 dark:border-gray-700">
    <div *ngFor="let item of items; let i = index" class="py-4" data-motion="reveal-child">
      <button
        type="button"
        class="flex w-full items-start justify-between gap-4 text-left"
        [attr.aria-expanded]="openIndex === i"
        [attr.data-testid]="'landing-faq-q-' + i"
        (click)="toggle(i)"
      >
        <span class="text-sm font-semibold text-gray-900 dark:text-white sm:text-base">
          {{ item.question }}
        </span>
        <span class="shrink-0 text-lg leading-none text-gray-400" aria-hidden="true">
          {{ openIndex === i ? '−' : '+' }}
        </span>
      </button>
      <p
        *ngIf="openIndex === i"
        class="mt-3 max-w-3xl text-sm text-gray-600 dark:text-gray-300"
        [attr.data-testid]="'landing-faq-a-' + i"
      >
        {{ item.answer }}
      </p>
    </div>
  </div>
</section>

<section class="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16">
  <header class="mb-8 text-center">
    <h2 class="text-2xl font-semibold text-gray-900 sm:text-3xl dark:text-white">Planos em BRL para o mercado brasileiro</h2>
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
      Escolha o plano ideal para acompanhar colaboração e agir antes que alguém suma.
    </p>
  </header>

  <div class="grid gap-6 md:grid-cols-2">
    <article *ngFor="let plan of plans" class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-900">
      <p class="text-sm font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">{{ plan.name }}</p>
      <p class="mt-3 text-4xl font-bold text-gray-900 dark:text-white">{{ plan.priceBrlMonthly }}</p>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-300">por mês</p>

      <p class="mt-4 text-sm text-gray-700 dark:text-gray-200">{{ plan.description }}</p>
      <p class="mt-4 text-sm text-gray-600 dark:text-gray-300">
        Até {{ plan.maxTrackedMembers }} membros rastreados.
      </p>

      <a
        class="mt-6 inline-flex min-h-11 items-center rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-600"
        routerLink="/signup"
      >
        Começar agora
      </a>
    </article>
  </div>
</section>

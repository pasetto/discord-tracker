<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <header class="border-b border-gray-200 bg-white px-4 py-4 dark:border-gray-800 dark:bg-gray-950">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-brand-600">Syntra</p>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-white">Painel da plataforma</h1>
        <p class="text-sm text-gray-500">Super Admin — gestão global (planos, usuários, tenants)</p>
      </div>
      <a routerLink="/app/dashboard" class="min-h-11 rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-800 dark:border-gray-700 dark:text-gray-100">
        Voltar ao app
      </a>
    </div>
  </header>

  <div class="mx-auto grid max-w-6xl gap-6 px-4 py-6 lg:grid-cols-[220px_1fr]">
    <nav class="space-y-1 rounded-2xl border border-gray-200 bg-white p-3 dark:border-gray-800 dark:bg-gray-950">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-300"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
          class="block rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <main class="min-w-0">
      <router-outlet />
    </main>
  </div>
</div>

<div class="min-h-screen xl:flex">
  <div class="hidden lg:block">
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 pb-20 transition-all duration-300 ease-in-out lg:pb-0"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <app-onboarding-banner />
      <router-outlet></router-outlet>
    </div>
  </div>
  <app-mobile-bottom-nav />
</div>

<div class="min-h-screen xl:flex">
  <!-- Sidebar + backdrop devem existir no mobile: o drawer usa translate, não display:none -->
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 min-w-0 overflow-x-hidden pb-20 transition-all duration-300 ease-in-out xl:pb-0"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <app-onboarding-banner />
      <router-outlet></router-outlet>
    </div>
  </div>
  <app-mobile-bottom-nav />
</div>

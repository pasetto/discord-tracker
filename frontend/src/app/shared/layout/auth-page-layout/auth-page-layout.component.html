<div class="relative z-1 min-h-screen overflow-x-hidden bg-white p-4 dark:bg-gray-900 sm:p-6 lg:p-0">
  <div
    class="relative flex min-h-screen w-full max-w-full flex-col justify-center dark:bg-gray-900 lg:flex-row lg:p-0"
  >
    <!-- Logo + tema no mobile (painel de marca some abaixo de lg) -->
    <div
      class="mx-auto mb-4 flex w-full max-w-md shrink-0 items-center justify-between lg:hidden"
      data-testid="auth-mobile-brand"
    >
      <a routerLink="/" class="block min-w-0" aria-label="Syntra — início">
        <img
          class="h-8 w-auto max-w-[160px] dark:hidden"
          src="/images/logo/logo.svg"
          alt="Syntra"
          width="160"
          height="40"
          data-testid="auth-logo-light"
        />
        <img
          class="hidden h-8 w-auto max-w-[160px] dark:block"
          src="/images/logo/logo-dark.svg"
          alt="Syntra"
          width="160"
          height="40"
          data-testid="auth-logo-dark"
        />
      </a>
      <app-theme-toggle-two />
    </div>

    <ng-content></ng-content>

    <div
      class="relative hidden h-full w-full items-center bg-brand-950 dark:bg-white/5 lg:grid lg:w-1/2"
      data-testid="auth-brand-panel"
    >
      <div class="z-1 flex items-center justify-center">
        <app-grid-shape />
        <div class="flex max-w-xs flex-col items-center">
          <a routerLink="/" class="mb-4 block">
            <img
              width="231"
              height="48"
              src="/images/logo/logo-dark.svg"
              alt="Syntra"
              data-testid="auth-panel-logo"
            />
          </a>
          <p class="text-center text-gray-400 dark:text-white/60">
            Colaboração em tempo real para times remotos
          </p>
        </div>
      </div>
    </div>

    <div class="fixed bottom-6 right-6 z-50 hidden lg:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>

<div class="relative">
  <button (click)="toggleDropdown()" class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400">
    <span class="mr-3 flex h-11 w-11 items-center justify-center overflow-hidden rounded-full bg-brand-500 text-sm font-semibold text-white">
      {{ initials }}
    </span>
    <span class="block mr-1 font-medium text-theme-sm">{{ displayName }}</span>
    <svg [ngClass]="{
        'stroke-gray-500 dark:stroke-gray-400 transition-transform duration-200': true,
        'rotate-180': isOpen
      }" width="18" height="20" viewBox="0 0 18 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4.3125 8.65625L9 13.3437L13.6875 8.65625" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark">
      <div>
        <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400">{{ displayName }}</span>
        <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400">{{ email }}</span>
        <span class="mt-1 block text-theme-xs text-gray-400">{{ organizationName }}</span>
      </div>

      <ul class="mt-4 flex flex-col gap-1 border-t border-gray-200 pt-3 dark:border-gray-800">
        <li>
          <a routerLink="/app/me" (click)="closeDropdown()"
            class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5">
            Meu portal
          </a>
        </li>
        <li>
          <a routerLink="/app/settings/discord" (click)="closeDropdown()"
            class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5">
            Configurar Discord
          </a>
        </li>
        <li>
          <button type="button" (click)="signOut()"
            class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5">
            Sair
          </button>
        </li>
      </ul>
    </div>
  }
</div>

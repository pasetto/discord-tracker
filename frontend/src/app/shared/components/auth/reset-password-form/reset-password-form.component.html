<div class="w-full max-w-md pt-10 mx-auto">
  <a
    routerLink="/login"
    class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
  >
    Voltar ao login
  </a>
</div>

<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div class="mb-5 sm:mb-8">
    <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
      Redefinir senha
    </h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Escolha uma nova senha para sua conta Syntra.
    </p>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <app-label>Nova senha <span class="text-error-500">*</span></app-label>
      <app-input-field
        type="password"
        placeholder="Mínimo 8 caracteres"
        [value]="newPassword"
        (valueChange)="newPassword = $event.toString()"
        name="newPassword"
        class="form-input"
        required
      />
    </div>

    <div>
      <app-label>Confirmar senha <span class="text-error-500">*</span></app-label>
      <app-input-field
        type="password"
        placeholder="Repita a nova senha"
        [value]="confirmPassword"
        (valueChange)="confirmPassword = $event.toString()"
        name="confirmPassword"
        class="form-input"
        required
      />
    </div>

    @if (errorMessage) {
      <p class="rounded-lg border border-error-300 bg-error-50 px-3 py-2 text-sm text-error-600">
        {{ errorMessage }}
      </p>
    }

    @if (successMessage) {
      <p class="rounded-lg border border-green-300 bg-green-50 px-3 py-2 text-sm text-green-700">
        {{ successMessage }}
        <a routerLink="/login" class="ml-1 underline">Entrar</a>
      </p>
    }

    <app-button className="w-full" size="sm" [disabled]="loading || !token" (btnClick)="onSubmit()">
      {{ loading ? 'Salvando...' : 'Salvar nova senha' }}
    </app-button>
  </form>
</div>

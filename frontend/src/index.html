<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Syntra | Colaboracao no Discord</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica o tema antes do bootstrap do Angular para evitar flash de tema claro.
    // Dark mode é o padrão quando não há preferência salva.
    (function () {
      try {
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
